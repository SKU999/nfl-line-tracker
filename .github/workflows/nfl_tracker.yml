name: NFL Line Tracker Pages

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/nfl_tracker.yml'
  workflow_dispatch:

# The odds provider blocks GitHub-hosted runners. The Mac runner owns scraping
# and chart generation; this workflow only deploys the checked-in charts.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "nfl-tracker-pages"
  cancel-in-progress: false

jobs:
  deploy_pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'charts'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
